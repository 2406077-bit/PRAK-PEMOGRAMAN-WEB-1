
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Modul 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <h2>Daftar Tugas Saya</h2>

        <form id="todoForm" novalidate>
            <div class="input-section">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Ketikkan tugas baru Anda..."
                    autocomplete="off"
                >
                <button type="submit" class="add-btn">Tambah</button>
            </div>

            <div class="error-message" id="inputError">
                Tugas tidak boleh kosong atau kurang dari 3 karakter!
            </div>
        </form>

        <!-- Fitur 1: Task Counter -->
        <p id="taskCounter" class="task-counter">
            Total: 0 Tugas | Selesai: 0 | Belum Selesai: 0
        </p>

        <!-- Daftar tugas -->
        <ul class="todo-list" id="todoList"></ul>

        <!-- Fitur 2: Bersihkan Tugas Selesai -->
        <button
            type="button"
            id="clearCompletedBtn"
            class="clear-btn"
        >
            Bersihkan Tugas Selesai
        </button>

        <!-- Popup konfirmasi custom -->
        <div id="deleteModal" class="modal-overlay">
            <div class="modal-box">
                <h3 id="modalTitle">Konfirmasi Hapus</h3>

                <p id="modalMessage">
                    Apakah Anda yakin ingin menghapus tugas ini?
                </p>

                <div class="modal-actions">
                    <button
                        type="button"
                        id="cancelDelete"
                        class="cancel-btn"
                    >
                        Batal
                    </button>

                    <button
                        type="button"
                        id="confirmDelete"
                        class="confirm-btn"
                    >
                        Ya, Hapus
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
